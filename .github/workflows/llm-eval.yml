name: llm-eval

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            accept-flake-config = true
            download-buffer-size = 134217728
      - name: Cache Nix store
        timeout-minutes: 2
        continue-on-error: true
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-eval-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-eval-v1-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 6G
      - name: Cache pinned candidate model
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/candidate.gguf
          key: candidate-v1-${{ hashFiles('eval/model.json') }}
      - name: Download and verify public candidate
        env:
          MODEL_PATH: ${{ runner.temp }}/candidate.gguf
        run: nix develop .#eval --command python eval/download.py "$MODEL_PATH"
      - name: Evaluate synthetic routing cases on CPU
        env:
          MODEL_PATH: ${{ runner.temp }}/candidate.gguf
          RESULT_PATH: ${{ runner.temp }}/eval-result.json
        run: nix develop .#eval --command bash eval/run-candidate.sh "$MODEL_PATH" "$RESULT_PATH"
      - name: Retain synthetic evaluation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-routing-evaluation
          path: ${{ runner.temp }}/eval-result.json
          if-no-files-found: ignore
          retention-days: 14
